<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 520px;
            margin: 60px auto;
            line-height: 1.7;
        }
        input {
            display: block;
            width: 100%;
            padding: 8px;
            margin: 4px 0 14px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 22px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Student Welcome Application</h2>
    <form th:action="@{/welcome}" th:object="${student}" method="post">
        <label>Name</label>
        <input type="text" th:field="*{name}" required>
        
        <label>Roll Number</label>
        <input type="text" th:field="*{rollNumber}" required>
        
        <label>Department</label>
        <input type="text" th:field="*{department}" required>
        
        <button type="submit">Submit</button>
    </form>
</body>
</html>
